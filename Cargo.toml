[package]
name = "offheap"
version = "0.5.0"
edition = "2021"
authors = ["Ryan Gustavo"]
license = "MIT OR Apache-2.0"
description = "Off-heap in-memory cache for Node.js (NAPI-RS): sharded LRU, ARC and W-TinyLFU with TTL and LZ4 compression"
repository = "https://github.com/ryangustav/OffHeap"
homepage = "https://github.com/ryangustav/OffHeap#readme"
readme = "README.md"
keywords = ["cache", "off-heap", "memory-cache", "tinylfu", "napi"]
categories = ["caching", "memory-management", "data-structures", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16.8", features = ["serde-json"] }
napi-derive = "2.16.9"
parking_lot = "0.12.3"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
seahash = "4.1.0"
rand = "0.8.5"
mimalloc = { version = "0.1.43", features = ["local_dynamic_tls"] }
lz4_flex = "0.11.3"
hashbrown = { version = "0.15", default-features = false, features = ["inline-more"] }
foldhash = "0.1"
bytes = "1"

[build-dependencies]
napi-build = "2.1.3"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
overflow-checks = true

[[bench]]
name = "rust_bench"
harness = false

[dev-dependencies]
criterion = "0.5.1"
